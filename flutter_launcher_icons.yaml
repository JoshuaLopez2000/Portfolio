# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/Icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F17"

  ios: false
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/Icon.png"
    background_color: "#0B0F17"
    theme_color: "#38BDF8"
