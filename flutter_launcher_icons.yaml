# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/Icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"

  ios: false
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/Icon.png"
    background_color: "#121212"
    theme_color: "#00FF41"
